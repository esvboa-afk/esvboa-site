<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title_full}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  {{robots}}
  <meta property="og:site_name" content="{{site.fullName}}">
  <meta property="og:title" content="{{title_full}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{site.url}}{{site.logo}}">
  <meta name="theme-color" content="#14702e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="text/calendar" title="ESVBOA events" href="/events.ics">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700;800&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="{{bodyclass}}">
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/">
        <span class="brand-logo"><img src="{{site.logo}}" alt="" width="56" height="56"></span>
        <span class="brand-text">
          <span class="brand-name">{{site.name}}</span>
          <span class="brand-full">{{site.fullName}}</span>
        </span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav" aria-label="Main">
        <ul>
          {{nav}}
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <p class="footer-name">{{site.fullName}}</p>
        <p>{{site.tagline}}</p>
      </div>
      <div>
        <p><a href="mailto:{{site.email}}">{{site.email}}</a></p>
        <p><a href="{{link.facebook}}">Facebook group</a></p>
        <p><a href="/events.ics">Subscribe to the calendar</a></p>
      </div>
      <p class="footer-fine">&copy; {{year}} {{site.name}}</p>
    </div>
  </footer>

  <script src="/js/site.js" defer></script>
</body>
</html>
